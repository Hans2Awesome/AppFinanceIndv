[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "appfinanceindv"
version = "0.2.0"
description = "Personal finance tracker: Telegram bot, FastAPI backend, Expo mobile app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.0,<22.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27.0",
]
# The FastAPI backend keeps its own manifest in backend/requirements.txt.

[project.scripts]
bot04 = "bot04.main:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["bot04*", "finance_core*", "backend*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["src", "."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]