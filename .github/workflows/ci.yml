name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: Backend, bot and shared core
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        env:
          SECRET_KEY: ci-secret-key-0123456789abcdef0123456789
          # Without this the PostgreSQL portability tests skip, so the
          # production database path would never be exercised in CI.
          POSTGRES_TEST_URL: postgresql://finance:finance@127.0.0.1:5432/finance_test
        run: pytest

  mobile:
    name: Mobile type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: mobile/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit